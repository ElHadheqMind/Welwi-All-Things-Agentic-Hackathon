name: welwi
description: "Welwi — a voice-first accessibility companion powered by Gemini and Google's Agent Development Kit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  table_calendar: ^3.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  camera: ^0.10.5+9
  record: ^6.1.1
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
